proxy:
  transport: stdio
  upstream: "npx @modelcontextprotocol/server-filesystem /tmp"
  bind_address: "127.0.0.1"
  port: 4422
  upstream_timeout_ms: 30000
  http:
    max_request_body_bytes: 10485760
    max_header_bytes: 1048576
    read_header_timeout: 10s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
    allowed_origins: []
    allowed_hosts:
      - localhost
      - 127.0.0.1
      - "::1"
  tls:
    ca_file: ""
    server_name: ""
    insecure_skip_verify: false
    client_cert_file: ""
    client_key_file: ""
  retry:
    max_retries: 0
    initial_interval_ms: 200
    max_interval_ms: 2000
  client_id: "claude-desktop"
  server_id: "filesystem"

auth:
  mode: none
  static:
    bearer_token: ""
    subject: local
    client_id: ""
    issuer: static
    roles: []
    scopes: []

audit:
  storage: jsonl
  path: ./audit.jsonl
  sqlite_path: ./audit.db
  sign: true
  secret: ""
  async:
    enabled: false
    queue_size: 4096
    batch_size: 128
    flush_interval_ms: 1000

middleware:
  rate_limit:
    enabled: true
    requests_per_minute: 60
  redact:
    enabled: true
    patterns:
      - password
      - token
      - secret
      - api_key
      - bearer
      - authorization

policy:
  enabled: false
  default_action: allow
  scope: all_operations
  rules:
    # - action: deny
    #   subject: alice@example.com
    #   issuer: https://login.example.com
    #   role: operator
    #   scope: tools:delete
    #   server_id: filesystem
    #   method: tools/call
    #   name: delete_file
    #   reason: "Destructive filesystem operations are blocked"

dashboard:
  enabled: true
  port: 9090

metrics:
  enabled: true
  port: 9091
  path: /metrics
  include_go_metrics: true
  include_process_metrics: true
  tool_labels: true

otel:
  enabled: false
  endpoint: "http://localhost:4318"
  service_name: "mcp-audit"
  headers: {}
  tls:
    ca_file: ""
    server_name: ""
    insecure_skip_verify: false
  retry:
    max_retries: 3
    initial_interval_ms: 200
    max_interval_ms: 2000
  queue_size: 1024
  batch_size: 64
  flush_interval_ms: 1000
  timeout_ms: 5000
